<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>İNAYA | Çok Yakında Hizmetinizdeyiz</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
      color: #1e293b;
      text-align: center;
      padding: 24px;
    }
    .card {
      background: #ffffff;
      max-width: 540px;
      width: 100%;
      padding: 40px 28px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.08);
    }
    .logo { max-width: 160px; height: auto; margin-bottom: 24px; }
    .hero-img { width: 100%; max-height: 300px; object-fit: contain; border-radius: 14px; margin-bottom: 24px; }
    h1 { font-size: 2.5rem; letter-spacing: 6px; color: #0f172a; margin-bottom: 10px; }
    p { font-size: 1rem; color: #64748b; margin-bottom: 28px; line-height: 1.6; }
    .btn {
      display: inline-block;
      background-color: #f27a1a;
      color: #ffffff;
      text-decoration: none;
      padding: 14px 32px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 1rem;
      transition: background 0.2s;
    }
    .btn:hover { background-color: #d9660b; }
  </style>
</head>
<body>
  <div class="card">
    <img src="Glossy Cyan Inaya Logo.webp" alt="İNAYA Logo" class="logo">
    <img src="çok yakında (1).png" alt="Çok Yakında" class="hero-img">
    <h1>SOON</h1>
    <p>Web sitemiz çok yakında yayında.<br>Ürünlerimizi şimdi Trendyol mağazamızdan inceleyebilirsiniz.</p>
    <a href="https://www.trendyol.com/magaza/inayatr-m-1319415" target="_blank" class="btn">Trendyol Mağazamıza Git</a>
  </div>
</body>
</html>
